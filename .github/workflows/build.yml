name: Build Binaries

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false

      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
            builder: cross
            binary_name: shoes

          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
            builder: musl-docker
            musl_image: x86_64-musl
            binary_name: shoes

          - target: i686-unknown-linux-gnu
            os: ubuntu-26.04
            builder: cross
            binary_name: shoes

          - target: i686-unknown-linux-musl
            os: ubuntu-26.04
            builder: musl-docker
            musl_image: i686-musl
            binary_name: shoes

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04
            builder: cross
            binary_name: shoes

          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04
            builder: musl-docker
            musl_image: aarch64-musl
            binary_name: shoes

          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-26.04
            builder: cross
            binary_name: shoes

          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-26.04
            builder: musl-docker
            musl_image: armv7-musleabihf
            binary_name: shoes

          - target: powerpc64le-unknown-linux-gnu
            os: ubuntu-26.04
            builder: cross
            binary_name: shoes

          - target: powerpc64le-unknown-linux-musl
            os: ubuntu-26.04
            builder: musl-docker
            musl_image: powerpc64le-musl
            binary_name: shoes

          - target: s390x-unknown-linux-gnu
            os: ubuntu-26.04
            builder: cross
            binary_name: shoes

          - target: s390x-unknown-linux-musl
            os: ubuntu-26.04
            builder: musl-docker
            musl_image: s390x-musl
            binary_name: shoes

          - target: loongarch64-unknown-linux-gnu
            os: ubuntu-26.04
            builder: cross
            binary_name: shoes

          - target: loongarch64-unknown-linux-musl
            os: ubuntu-26.04
            builder: musl-docker
            musl_image: loongarch64-musl
            binary_name: shoes

          - target: mips64el-unknown-linux-gnuabi64
            os: ubuntu-26.04
            builder: cross-build-std
            binary_name: shoes

          - target: mips64el-unknown-linux-muslabi64
            os: ubuntu-26.04
            builder: musl-docker
            musl_image: mips64el-muslabi64
            binary_name: shoes

          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-26.04
            builder: cross
            binary_name: shoes

          - target: riscv64gc-unknown-linux-musl
            os: ubuntu-26.04
            builder: musl-docker
            musl_image: riscv64gc-musl
            binary_name: shoes

          - target: x86_64-apple-darwin
            os: macos-latest
            builder: cargo
            binary_name: shoes

          - target: aarch64-apple-darwin
            os: macos-latest
            builder: cargo
            binary_name: shoes

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        if: matrix.builder == 'cross' || matrix.builder == 'cargo'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install nightly Rust
        if: matrix.builder == 'cross-build-std'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Setup cache
        if: matrix.builder != 'musl-docker'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross' || matrix.builder == 'cross-build-std'
        run: |
          cargo install cross \
            --git https://github.com/cross-rs/cross \
            --locked

      - name: Configure MIPS64EL GNU
        if: matrix.builder == 'cross-build-std'
        run: |
          cat > Cross.ci.toml <<'EOF'
          [build.env]
          passthrough = ["CARGO_PROFILE_RELEASE_LTO"]

          [target.mips64el-unknown-linux-gnuabi64]
          image = "ghcr.io/cross-rs/mips64el-unknown-linux-gnuabi64:main"
          build-std = ["std", "panic_abort"]
          EOF

      - name: Build with cross
        if: matrix.builder == 'cross'
        run: |
          cross build \
            --release \
            --bin shoes \
            --target ${{ matrix.target }}

      - name: Build MIPS64EL GNU
        if: matrix.builder == 'cross-build-std'
        env:
          RUSTUP_TOOLCHAIN: nightly
          CROSS_CONFIG: Cross.ci.toml
          CARGO_PROFILE_RELEASE_LTO: "off"
        run: |
          cross build \
            --release \
            --bin shoes \
            --target ${{ matrix.target }}

      - name: Build musl
        if: matrix.builder == 'musl-docker'
        shell: bash
        run: |
          IMAGE="ghcr.io/rust-cross/rust-musl-cross:${{ matrix.musl_image }}"

          docker pull "$IMAGE"

          docker run --rm \
            -v "$PWD:/home/rust/src" \
            -w /home/rust/src \
            -e CARGO_TERM_COLOR=always \
            "$IMAGE" \
            bash -lc '
              set -e

              TARGET="${{ matrix.target }}"

              TARGET_UPPER="$(
                printf "%s" "$TARGET" |
                tr "[:lower:]" "[:upper:]" |
                tr ".-" "__"
              )"

              RUSTFLAGS_VAR="CARGO_TARGET_${TARGET_UPPER}_RUSTFLAGS"
              CURRENT_RUSTFLAGS="${!RUSTFLAGS_VAR:-}"

              export "$RUSTFLAGS_VAR=${CURRENT_RUSTFLAGS:+$CURRENT_RUSTFLAGS }-C link-arg=-lgcc"

              case "$TARGET" in
                mips64el-unknown-linux-muslabi64|s390x-unknown-linux-musl)
                  export CARGO_PROFILE_RELEASE_LTO=off
                  ;;
              esac

              echo "Target: $TARGET"
              echo "$RUSTFLAGS_VAR=${!RUSTFLAGS_VAR}"
              echo "Release LTO: ${CARGO_PROFILE_RELEASE_LTO:-fat}"

              cargo build \
                --release \
                --bin shoes \
                --target "$TARGET"
            '

          sudo chown -R "$(id -u):$(id -g)" target

      - name: Build native
        if: matrix.builder == 'cargo'
        run: |
          cargo build \
            --release \
            --bin shoes \
            --target ${{ matrix.target }}

      - name: Verify binary
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"

          if [ ! -f "$BINARY" ]; then
            echo "Binary not found:"
            echo "$BINARY"

            echo "Release directory:"
            ls -la "target/${{ matrix.target }}/release/" || true

            exit 1
          fi

          echo "Binary found:"
          ls -lh "$BINARY"

          echo "Binary type:"
          file "$BINARY" || true

          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu|x86_64-unknown-linux-musl)
              "$BINARY" --help || true
              ;;
            aarch64-apple-darwin)
              "$BINARY" --help || true
              ;;
          esac

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p artifacts

          cp \
            "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
            "artifacts/${{ matrix.binary_name }}"

          cd artifacts

          tar \
            -czf "${{ github.event.repository.name }}-${{ matrix.target }}.tar.gz" \
            "${{ matrix.binary_name }}"

          rm "${{ matrix.binary_name }}"

          echo "Artifacts:"
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts \
            -type f \
            -name "*.tar.gz" \
            -print \
            | sort

      - name: Flatten artifacts
        run: |
          mkdir -p release-artifacts

          find artifacts \
            -type f \
            -name "*.tar.gz" \
            -exec cp {} release-artifacts/ \;

          echo "Release artifacts:"
          ls -lah release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: true
          generate_release_notes: true
